<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #0d0d0b;
  color: #f5f0e8;
  font-family: 'Jost', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  border: 1px solid rgba(184,150,62,0.3);
  padding: 50px;
  width: 350px;
  text-align: center;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  background: transparent;
  border: 1px solid rgba(184,150,62,0.2);
  color: white;
}

button {
  width: 100%;
  padding: 14px;
  background: #b8963e;
  border: none;
  color: black;
  letter-spacing: 0.2em;
  cursor: pointer;
}

body {
  transition: opacity 0.6s ease;
}

body.fade-out {
  opacity: 0;
}
</style>
</head>

<body>

<div class="box">
  <h2>Request Access</h2>

 <form id="access-form" action="https://formspree.io/f/xwvykvnz" method="POST">
    <input type="hidden" name="form-name" value="Investor Access Request">
    <input type="hidden" name="_redirect" value="https://hiyavishwanath.github.io/nanday-site/thankyou.html">

    <label style="font-size:0.7rem;letter-spacing:0.2em;color:#b8963e;">
        Email Address
    </label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label style="font-size:0.7rem;letter-spacing:0.2em;color:#b8963e;">
        Brief Introduction
    </label>
    <textarea name="message" placeholder="Tell us about your background, interest, or reason for access"></textarea>

    <button type="submit">Request Access</button>

    </form>

</div>

<script>
const form = document.querySelector("form");

form.addEventListener("submit", function(e) {
  e.preventDefault(); // stop instant redirect

  const data = new FormData(form);

  fetch(form.action, {
    method: form.method,
    body: data,
    headers: { 'Accept': 'application/json' }
  }).then(() => {

    // fade out page
    document.body.classList.add("fade-out");

    // redirect after fade
    setTimeout(() => {
      window.location.href = "thankyou.html";
    }, 600);

  });
});
</script>

</body>
</html>
